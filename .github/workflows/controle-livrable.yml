name: Controle du depot

# Contrôle documentaire et régressions déterministes ; ne remplace pas une exécution MariaDB.
on:
  push:
  pull_request:

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Avancement des livrables et fichiers interdits
        run: python3 scripts/controle_livrable.py
      - name: Dépendances des contrôles déterministes
        run: pip install SQLAlchemy==2.0.35 pandas==2.3.3 PyYAML==6.0.2 nbformat==5.11.1 nbclient==0.11.0 streamlit==1.50.0 great_expectations==0.18.19 numpy==1.26.4
      - name: Analyse syntaxique Python et notebooks
        run: python3 scripts/verifier_syntaxe.py
      - name: Régressions de l’audit final et contre-exemple de survie
        run: python3 -m unittest discover -s tests -v
