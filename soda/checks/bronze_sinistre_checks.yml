# Bronze : lot obligatoire ; diagnostic distinct du CRM, données inchangées.
# Diagnostic source CRM : les échecs RQ-014 ne sont pas une décision sur la porte G.
# Porte G : rapprochement BAN des sinistres publiables, voir S4/S5 et le certificat.
filter crm_sinistre [lot]:
  where: _batch_id = '${BATCH_ID}'

checks for crm_sinistre [lot]:
  - row_count > 0:
      name: Bronze | sinistre | lot présent
  - duplicate_count(sinistre_id) = 0:
      name: RQ-020 | Bronze lot ${BATCH_ID} | sinistre_id sans doublon
  - missing_count(sinistre_id) = 0:
      name: RQ-020 | Bronze lot ${BATCH_ID} | sinistre_id renseigné

  - missing_count(cp_sinistre) = 0:
      name: RQ-014 | Bronze lot ${BATCH_ID} | code postal de sinistre renseigné

  - invalid_count(cp_sinistre) = 0:
      name: RQ-014 | Bronze lot ${BATCH_ID} | code postal de sinistre sur 5 chiffres
      valid regex: '^[0-9]{5}$'
  - missing_count(adresse_sinistre) = 0:
      name: RQ-014 | Bronze lot ${BATCH_ID} | adresse de sinistre renseignée

  - failed rows:
      name: RQ-017 | Bronze lot ${BATCH_ID} | sinistre dans la période de garantie
      fail query: |
        SELECT s.sinistre_id
        FROM (SELECT * FROM bronze.crm_sinistre WHERE _batch_id = '${BATCH_ID}') s
        LEFT JOIN (SELECT * FROM bronze.crm_contrat WHERE _batch_id = '${BATCH_ID}') c ON c.contrat_id = s.contrat_id
        WHERE c.contrat_id IS NULL
           OR STR_TO_DATE(s.date_survenance, '%Y-%m-%d') IS NULL
           OR STR_TO_DATE(c.date_debut, '%Y-%m-%d') IS NULL
           OR STR_TO_DATE(c.date_fin, '%Y-%m-%d') IS NULL
           OR STR_TO_DATE(s.date_survenance, '%Y-%m-%d') < STR_TO_DATE(c.date_debut, '%Y-%m-%d')
           OR STR_TO_DATE(s.date_survenance, '%Y-%m-%d') > STR_TO_DATE(c.date_fin, '%Y-%m-%d')

  - taux_erreur_adresse:
      name: RQ-014 | Bronze lot ${BATCH_ID} | taux d'adresses non reconnues par la BAN
      taux_erreur_adresse query: |
        SELECT 100.0 * SUM(b.id_ban IS NULL) / COUNT(*) AS taux_erreur
        FROM (SELECT * FROM bronze.crm_sinistre WHERE _batch_id = '${BATCH_ID}') s
        LEFT JOIN silver.ref_ban b
               ON CONCAT(b.numero, ' ', b.voie) = s.adresse_sinistre
              AND b.code_postal = s.cp_sinistre
              AND b.commune = s.ville_sinistre
      fail: when > 0
