# Diagnostic Gold : clé technique RQ-020 et signatures métier RQ-019 distinctes.
# Les signatures incomplètes sont exclues comme dans s4_rq019.signatures ;
# la complétude et la couverture certifiée restent contrôlées par S4/S5.
checks for client_unique:
  - duplicate_count(cli_id) = 0:
      name: RQ-020 | Gold | CLI sans doublon
  - missing_count(cli_id) = 0:
      name: RQ-020 | Gold | CLI renseigné
  - failed rows:
      name: RQ-019 | Gold | signatures métier réparties entre plusieurs CLI
      fail query: |
        SELECT 'identites_PP' AS perimetre, s._batch_id, COUNT(DISTINCT x.cli_id) AS nb_cli
        FROM silver.client s
        JOIN gold.xref_identifiants x ON x.silver_row_id = s.silver_row_id
        JOIN gold.client_unique g ON g.cli_id = x.cli_id AND g._batch_id = s._batch_id
        WHERE s.nature_personne = 'PP' AND s.identite_normalisee IS NOT NULL
          AND s.prenom_normalise IS NOT NULL AND s.date_naissance IS NOT NULL
        GROUP BY s._batch_id, s.identite_normalisee, s.prenom_normalise, s.date_naissance
        HAVING COUNT(DISTINCT x.cli_id) > 1
        UNION ALL
        SELECT 'identites_PM', s._batch_id, COUNT(DISTINCT x.cli_id)
        FROM silver.client s
        JOIN gold.xref_identifiants x ON x.silver_row_id = s.silver_row_id
        JOIN gold.client_unique g ON g.cli_id = x.cli_id AND g._batch_id = s._batch_id
        WHERE s.nature_personne = 'PM' AND s.identite_normalisee IS NOT NULL
          AND s.cp IS NOT NULL AND s.adresse_normalisee IS NOT NULL
        GROUP BY s._batch_id, s.identite_normalisee, s.cp, s.adresse_normalisee
        HAVING COUNT(DISTINCT x.cli_id) > 1
        UNION ALL
        SELECT 'signature_nom_cp_naissance_tel', _batch_id, COUNT(DISTINCT cli_id)
        FROM gold.client_unique
        WHERE nom_reference IS NOT NULL AND cp IS NOT NULL
          AND date_naissance IS NOT NULL AND telephone IS NOT NULL
        GROUP BY _batch_id, nom_reference, cp, date_naissance, telephone
        HAVING COUNT(DISTINCT cli_id) > 1
        UNION ALL
        SELECT 'signature_nom_email', _batch_id, COUNT(DISTINCT cli_id)
        FROM gold.client_unique
        WHERE nom_reference IS NOT NULL AND email IS NOT NULL
        GROUP BY _batch_id, nom_reference, email
        HAVING COUNT(DISTINCT cli_id) > 1
