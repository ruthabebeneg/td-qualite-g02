checks for contrat:
  - duplicate_count(contrat_id) = 0:
      name: RQ-020 | CRM | contrat_id sans doublon
  - missing_count(contrat_id) = 0:
      name: RQ-020 | CRM | contrat_id renseigné

  - failed rows:
      name: RQ-001 | CRM | date_fin postérieure à date_debut
      fail condition: date_fin <= date_debut

  - invalid_count(duree_garantie_mois) = 0:
      name: RQ-010 | CRM | durée de garantie autorisée
      valid values: [12, 24, 36, 60]

  - values in (code_type) must exist in type_contrat (code_type):
      name: RQ-011 | CRM | type de contrat connu
  - values in (souscripteur_id) must exist in client (client_id):
      name: RQ-012 | CRM | souscripteur existant

  - rq013_assures_orphelins_apres_nullif:
      name: RQ-013 | CRM projection NULLIF | assures existants
      rq013_assures_orphelins_apres_nullif query: |
        SELECT COUNT(*) AS nb
        FROM contrat c
        WHERE NULLIF(c.assure_id, '0') IS NOT NULL
          AND NOT EXISTS (
            SELECT 1 FROM client k
            WHERE k.client_id = NULLIF(c.assure_id, '0')
          )
      fail: when > 0

  - rq018_ecart_directions:
      name: RQ-018 | CRM | ecart nul entre les trois directions
      rq018_ecart_directions query: |
        SELECT MAX(nb_actifs) - MIN(nb_actifs) AS ecart
        FROM (
          SELECT COUNT(DISTINCT c.souscripteur_id) AS nb_actifs
          FROM contrat c
          WHERE c.date_debut <= '${REFERENCE_DATE}'
            AND c.date_fin >= '${REFERENCE_DATE}'
            AND c.date_derniere_cotisation >= DATE_SUB('${REFERENCE_DATE}', INTERVAL 3 MONTH)
          UNION ALL
          SELECT COUNT(DISTINCT c.souscripteur_id)
          FROM contrat c
          WHERE c.date_debut <= '${REFERENCE_DATE}'
            AND c.date_fin >= '${REFERENCE_DATE}'
            AND c.date_derniere_cotisation >= DATE_SUB('${REFERENCE_DATE}', INTERVAL 3 MONTH)
          UNION ALL
          SELECT COUNT(DISTINCT c.souscripteur_id)
          FROM contrat c
          WHERE c.date_debut <= '${REFERENCE_DATE}'
            AND c.date_fin >= '${REFERENCE_DATE}'
            AND c.date_derniere_cotisation >= DATE_SUB('${REFERENCE_DATE}', INTERVAL 3 MONTH)
        ) directions
      fail: when > 0
